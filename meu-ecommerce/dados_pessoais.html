<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Dados - MDG Informatica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body data-pagina="dados_pessoais">
    <header id="cabecalho"></header>

    <main class="container conteudo">
        <section class="caixa-formulario">
            <h1>Meus Dados</h1>
            <p class="subtitulo">Atualize seu nome e e-mail.</p>
            <div id="alertas" aria-live="polite"></div>
            <form id="formulario-dados" novalidate>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" id="nome" name="nome" class="form-control" autocomplete="name">
                </div>
                <div class="mb-4">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" autocomplete="email">
                </div>
                <button type="submit" class="btn btn-mdg w-100">Alterar meus dados</button>
            </form>
            <p class="rodape-formulario"><a href="enderecos.html"><i class="bi bi-geo-alt me-1"></i>Meus Endereços</a></p>
        </section>
    </main>

    <footer id="rodape" class="rodape"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', iniciarPagina);
    </script>
</body>
</html>
