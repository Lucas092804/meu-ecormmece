<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Endereços - MDG Informatica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body data-pagina="enderecos">
    <header id="cabecalho"></header>

    <main class="container conteudo">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <h1 class="titulo-pagina mb-0">Meus Endereços</h1>
            <button type="button" class="btn btn-mdg" data-bs-toggle="modal" data-bs-target="#modal-endereco">
                <i class="bi bi-plus-lg me-2"></i>Cadastrar Novo Endereço
            </button>
        </div>
        <div id="lista-enderecos" class="lista-cartoes"></div>

        <div class="modal fade" id="modal-endereco" tabindex="-1" aria-labelledby="titulo-modal-endereco" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <form class="modal-content" id="formulario-endereco">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="titulo-modal-endereco">Cadastrar novo endereço</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="endereco-cep" class="form-label">CEP</label>
                            <input type="text" id="endereco-cep" name="cep" class="form-control" placeholder="99999-999" inputmode="numeric" maxlength="9" required>
                            <div class="form-text" id="status-cep" role="status" aria-live="polite"></div>
                        </div>
                        <div class="mb-3">
                            <label for="endereco-rua" class="form-label">Rua</label>
                            <input type="text" id="endereco-rua" name="rua" class="form-control" required>
                        </div>
                        <div class="row g-3">
                            <div class="col-4">
                                <label for="endereco-numero" class="form-label">Número</label>
                                <input type="text" id="endereco-numero" name="numero" class="form-control" required>
                            </div>
                            <div class="col-8">
                                <label for="endereco-cidade" class="form-label">Cidade/Estado</label>
                                <input type="text" id="endereco-cidade" name="cidadeEstado" class="form-control" placeholder="Formosa/GO" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-mdg">Salvar endereço</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer id="rodape" class="rodape"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', iniciarPagina);
    </script>
</body>
</html>
