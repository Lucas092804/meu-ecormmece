<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - MDG Informatica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body data-pagina="produtos">
    <header id="cabecalho"></header>

    <main class="container conteudo">
        <h1 class="titulo-pagina">Lista de Produtos</h1>

        <form class="painel filtros-produtos" id="formulario-filtros" role="search" aria-label="Filtros de produtos">
            <div class="row g-3 align-items-end">
                <div class="col-md-8">
                    <label for="busca-produtos" class="form-label">Buscar produto</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="search" id="busca-produtos" class="form-control" placeholder="Digite o nome do produto" autocomplete="off">
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="categoria-produtos" class="form-label">Categoria</label>
                    <select id="categoria-produtos" class="form-select">
                        <option value="">Todas as categorias</option>
                        <option value="Vestuário">Vestuário</option>
                        <option value="Eletrônicos">Eletrônicos</option>
                        <option value="Calçados">Calçados</option>
                        <option value="Eletrodomésticos">Eletrodomésticos</option>
                        <option value="Acessórios">Acessórios</option>
                        <option value="Móveis">Móveis</option>
                    </select>
                </div>
            </div>
        </form>

        <p id="mensagem-produtos" class="mensagem-lista" role="status" aria-live="polite">Carregando produtos...</p>
        <div class="grade-produtos" id="lista-produtos"></div>
    </main>

    <footer id="rodape" class="rodape"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', iniciarPagina);
    </script>
</body>
</html>
