<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - MDG Informatica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body data-pagina="meus_pedidos">
    <header id="cabecalho"></header>

    <main class="container conteudo">
        <h1 class="titulo-pagina">Meus Pedidos</h1>
        <div id="alertas" aria-live="polite"></div>
        <div id="lista-pedidos" class="lista-cartoes"></div>

        <details class="painel area-testes">
            <summary>Testar erros do cancelamento</summary>
            <p class="mb-3">Chama a API com protocolos especiais para simular as respostas de erro.</p>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-protocolo-teste="PED-0000">PED-0000 (404)</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-protocolo-teste="PED-ENVIADO">PED-ENVIADO (422)</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-protocolo-teste="">Sem protocolo (400)</button>
            </div>
        </details>
    </main>

    <footer id="rodape" class="rodape"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', iniciarPagina);
    </script>
</body>
</html>
