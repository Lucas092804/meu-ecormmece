<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - MDG Informatica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body data-pagina="novo_usuario">
    <header id="cabecalho"></header>

    <main class="container conteudo">
        <section class="caixa-formulario">
            <h1>Cadastro</h1>
            <p class="subtitulo">Crie sua conta para acompanhar seus pedidos.</p>
            <div id="alertas" aria-live="polite"></div>
            <form id="formulario-cadastro" novalidate>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu nome completo" autocomplete="name">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="exemplo@email.com" autocomplete="email">
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-control" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
                </div>
                <div class="mb-4">
                    <label for="confirmacaoSenha" class="form-label">Confirmar senha</label>
                    <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" class="form-control" placeholder="Repita a senha" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-mdg w-100">Cadastrar</button>
            </form>
            <p class="rodape-formulario">Já tem conta? <a href="login.html">Entrar</a></p>
        </section>
    </main>

    <footer id="rodape" class="rodape"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', iniciarPagina);
    </script>
</body>
</html>
